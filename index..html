<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VERA.EXE - Cat Chaos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  font-family: 'Comic Sans MS', cursive;
  background: black;
  touch-action: none;
}

/* FLASHY BACKGROUND */
@keyframes flashyBg {
  0%   { background: #ff004c; }
  10%  { background: #00ffcc; }
  20%  { background: #3300ff; }
  30%  { background: #ff00ff; }
  40%  { background: #00ff00; }
  50%  { background: #ffff00; }
  60%  { background: #ff6600; }
  70%  { background: #00ccff; }
  80%  { background: #cc00ff; }
  90%  { background: #ff0066; }
  100% { background: #ffffff; }
}

body.playing {
  animation: flashyBg 1.2s infinite linear;
}

#startBtn {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 3rem;
  padding: 1rem 2rem;
  background: #000;
  color: #0ff;
  border: 4px solid #f0f;
  text-shadow: 0 0 10px #fff;
  cursor: pointer;
  z-index: 10000;
}

#scoreboard {
  position: fixed;
  top: 8px;
  left: 8px;
  font-size: 2rem;
  color: white;
  text-shadow: 0 0 10px black;
  z-index: 1000;
  display: none;
}

#vera {
  position: absolute;
  width: 110px;
  height: 110px;
  background: url("assets/vera.png") center/contain no-repeat;
  background-color: transparent;
  z-index: 10;
  pointer-events: none;
  display: none;
}


.cat {
  position: absolute;
  width: 150px;
  height: 150px;
  animation: fall linear forwards;
  pointer-events: none;
}

@keyframes fall { from { top: -160px; } to { top: 120vh; } }

.trash {
  position: absolute;
  font-size: 2.4rem;
  font-weight: bold;
  color: white;
  text-shadow: 0 0 8px black;
  animation: floatUp 3s ease-out forwards;
}

@keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-140px); }}
</style>
</head>
<body>

<button id="startBtn">START</button>

<audio id="bgMusic" loop>
  <source src="assets/quake-aavirall-main-version-33794-02-15.mp3" type="audio/mpeg">
</audio>

<div id="scoreboard">SCORE: 0</div>
<div id="vera"></div>

<script>
const startBtn = document.getElementById("startBtn");
const music   = document.getElementById("bgMusic");
const scoreboard = document.getElementById("scoreboard");
const vera = document.getElementById("vera");

let playing = false;
let score = 0;

// Start game & music on button tap
startBtn.addEventListener("click", () => {
  document.body.classList.add("playing");
  startBtn.style.display = "none";
  scoreboard.style.display = "block";
  vera.style.display = "block";
  music.play().catch(console.warn);
  playing = true;
  initGame();
});

function initGame() {
  // Vera initial position
  let veraX = innerWidth / 2, veraY = innerHeight / 2;
  vera.style.left = veraX + "px";
  vera.style.top  = veraY + "px";

  function moveVera(x, y) {
    veraX = x - vera.offsetWidth / 2;
    veraY = y - vera.offsetHeight / 2;
    vera.style.left = veraX + "px";
    vera.style.top  = veraY + "px";
  }

  document.addEventListener("touchstart", e => moveVera(e.touches[0].clientX, e.touches[0].clientY));
  document.addEventListener("touchmove", e => moveVera(e.touches[0].clientX, e.touches[0].clientY));
  document.addEventListener("mousedown", e => moveVera(e.clientX, e.clientY));
  document.addEventListener("mousemove", e => { if (e.buttons > 0) moveVera(e.clientX, e.clientY); });

  // Spawn cats
  const catGifs = [
    "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif",
    "https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif",
    "https://media.giphy.com/media/13borq7Zo2kulO/giphy.gif",
    "https://media.giphy.com/media/12HZukMBlutpoQ/giphy.gif",
    "https://media.giphy.com/media/5aLrlDiJPMPFS/giphy.gif",
    "https://media.giphy.com/media/ND6xkVPaj8tHO/giphy.gif",
    "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif",
    "https://media.giphy.com/media/26tPplGWjN0xLybiU/giphy.gif"
  ];

  setInterval(() => {
    if (!playing) return;
    const cat = document.createElement("img");
    cat.className = "cat";
    cat.src = catGifs[Math.floor(Math.random() * catGifs.length)];
    cat.style.left = Math.random() * (innerWidth - 150) + "px";
    cat.style.animationDuration = (3 + Math.random() * 2) + "s";
    document.body.appendChild(cat);
    setTimeout(() => cat.remove(), 6000);
  }, 650);

  // Trashy text
  const trashWords = ["LOL","WTF","XD","BRUH","YOOO","OMG","AYO","HAHA","KEKW"];
  setInterval(() => {
    const t = document.createElement("div");
    t.className = "trash";
    t.textContent = trashWords[Math.floor(Math.random() * trashWords.length)];
    t.style.left = Math.random() * innerWidth + "px";
    t.style.top  = Math.random() * innerHeight + "px";
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }, 900);

  // Collision & scoring
  setInterval(() => {
    const vRect = vera.getBoundingClientRect();
    document.querySelectorAll(".cat").forEach(cat => {
      const cRect = cat.getBoundingClientRect();
      if (!(cRect.right < vRect.left || cRect.left > vRect.right ||
            cRect.bottom < vRect.top || cRect.top > vRect.bottom)) {
        score++;
        scoreboard.textContent = "SCORE: " + score;
        cat.remove();
      }
    });
  }, 50);
}
</script>

</body>
</html>
