<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vera Cat Chaos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    @keyframes flashyBg {
      0%   { background: #ff004c;}
      10%  { background: #00ffcc;}
      20%  { background: #3300ff;}
      30%  { background: #ff00ff;}
      40%  { background: #00ff00;}
      50%  { background: #ffff00;}
      60%  { background: #ff6600;}
      70%  { background: #00ccff;}
      80%  { background: #cc00ff;}
      90%  { background: #ff0066;}
      100% { background: #ffffff;}
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: 'Press Start 2P', cursive;
      animation: flashyBg 1.2s infinite linear;
      touch-action: none;
    }

    #score {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 14px;
      color: white;
      text-shadow: 0 0 5px #fff, 0 0 10px #f0f, 0 0 20px #0ff;
      z-index: 1000;
    }

    #vera {
      position: absolute;
      width: 100px;
      height: 100px;
      background: url("assets/vera.png") center/contain no-repeat;
      pointer-events: none;
      z-index: 10;
    }

    .cat {
      position: absolute;
      width: 130px;
      height: 130px;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      from { top: -140px; }
      to   { top: 110vh; }
    }

    .trash {
      position: absolute;
      font-size: 1.8rem;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 6px black;
      animation: floatUp 2.5s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-120px); }
    }
  </style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="assets/quake-aavirall-main-version-33794-02-15.mp3" type="audio/mpeg">
</audio>

<div id="score">SCORE: 0</div>
<div id="vera"></div>

<script>
const vera = document.getElementById("vera");
let veraX = window.innerWidth / 2 - 50;
let veraY = window.innerHeight / 2 - 50;
vera.style.left = veraX + "px";
vera.style.top  = veraY + "px";

function moveVera(x, y) {
  veraX = x - vera.offsetWidth / 2;
  veraY = y - vera.offsetHeight / 2;
  vera.style.left = veraX + "px";
  vera.style.top  = veraY + "px";
}

document.addEventListener("touchstart", e => moveVera(e.touches[0].clientX, e.touches[0].clientY));
document.addEventListener("touchmove", e => moveVera(e.touches[0].clientX, e.touches[0].clientY));
document.addEventListener("mousedown", e => moveVera(e.clientX, e.clientY));
document.addEventListener("mousemove", e => { if (e.buttons > 0) moveVera(e.clientX, e.clientY); });

const scoreBoard = document.getElementById("score");
let score = 0;

const catUrls = [
  "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif",
  "https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif",
  "https://media.giphy.com/media/13borq7Zo2kulO/giphy.gif",
];

setInterval(() => {
  const cat = document.createElement("img");
  cat.className = "cat";
  cat.src = catUrls[Math.floor(Math.random() * catUrls.length)];
  cat.style.left = Math.random() * (window.innerWidth - 130) + "px";
  cat.style.animationDuration = (3 + Math.random() * 2) + "s";
  document.body.appendChild(cat);
  setTimeout(() => cat.remove(), 6000);
}, 700);

const texts = ["LOL","WTF","XD","BRUH","OMG","NOICE","YOOO","AYO"];
setInterval(() => {
  const t = document.createElement("div");
  t.className = "trash";
  t.textContent = texts[Math.floor(Math.random() * texts.length)];
  t.style.left = Math.random() * window.innerWidth + "px";
  t.style.top  = Math.random() * window.innerHeight + "px";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}, 900);

function checkCollisions() {
  const vRect = vera.getBoundingClientRect();
  document.querySelectorAll(".cat").forEach(cat => {
    const cRect = cat.getBoundingClientRect();
    if (!(cRect.right < vRect.left || cRect.left > vRect.right ||
          cRect.bottom < vRect.top || cRect.top > vRect.bottom)) {
      score++;
      scoreBoard.textContent = "SCORE: " + score;
      cat.remove();
    }
  });
}
setInterval(checkCollisions, 50);

const music = document.getElementById("bgMusic");
function enableMusic() {
  music.play().catch(() => {});
  document.removeEventListener("click", enableMusic);
  document.removeEventListener("touchstart", enableMusic);
}
document.addEventListener("click", enableMusic);
document.addEventListener("touchstart", enableMusic);
</script>

</body>
</html>
